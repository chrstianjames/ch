name: Convert Video to 360p

on:
  workflow_dispatch:
    inputs:
      asset_hash:
        description: 'The unique hash for the uploaded video (without extension)'
        required: true
        default: 'examplehash'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Get Release Details
        id: release
        run: |
          echo "Fetching release data for tag 'video-uploads'..."
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/video-uploads" > release.json
          cat release.json
          release_id=$(jq -r '.id' release.json)
          if [ -z "$release_id" ] || [ "$release_id" == "null" ]; then
            echo "Release not found."
            exit 1
          fi
          echo "Release ID: $release_id"
          echo "::set-output name=release_id::$release_id"

      - name: Find Original Video Asset
        id: find_asset
        run: |
          asset_hash="${{ github.event.inputs.asset_hash }}"
          asset_name="original_${asset_hash}.mp4"
          echo "Looking for asset: $asset_name"
          asset_url=$(jq -r --arg name "$asset_name" '.assets[] | select(.name==$name) | .browser_download_url' release.json)
          if [ -z "$asset_url" ] || [ "$asset_url" == "null" ]; then
            echo "Original asset '$asset_name' not found."
            exit 1
          fi
          echo "Found original asset URL: $asset_url"
          echo "::set-output name=asset_url::$asset_url"

      - name: Download Original Video
        run: |
          echo "Downloading the original video..."
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "${{ steps.find_asset.outputs.asset_url }}" -o original.mp4
          ls -lh original.mp4

      - name: Convert Video to 360p with FFmpeg
        run: |
          echo "Converting video to 360p..."
          # This command scales the height to 360 while preserving aspect ratio (width becomes -2 to auto-calc even number).
          ffmpeg -i original.mp4 -vf "scale=-2:360" -c:v libx264 -preset veryfast -crf 23 -c:a copy converted.mp4
          ls -lh converted.mp4

      - name: Upload Converted Video to Release
        run: |
          asset_hash="${{ github.event.inputs.asset_hash }}"
          new_asset_name="360p_${asset_hash}.mp4"
          echo "Uploading converted video as '$new_asset_name'..."
          # The 'gh release upload' command uploads to the release tagged 'video-uploads'
          gh release upload video-uploads converted.mp4 --repo "${GITHUB_REPOSITORY}" --clobber --name "$new_asset_name"
